apiVersion: apps/v1
kind: Deployment

metadata:
  name: vishnu-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vishnu-app

  template:
    metadata:
      labels:
        app: vishnu-app

    spec:
      containers:
      - name: vishnu-app

        image: vishnureddy05/vishnu-app:latest

        ports:
        - containerPort: 8080
